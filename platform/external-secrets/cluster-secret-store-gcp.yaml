# ClusterSecretStore backed by GCP Secret Manager. Auth is Workload Identity:
# the ESO KSA is annotated with the external-secrets GSA, which holds
# secretAccessor on each listed secret (tofu/modules/platform-iam). Secret IDs
# cannot contain slashes, so `broker/oidc-client` is `broker-oidc-client` here
# and the JSON key is read through remoteRef.property.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-sm
spec:
  provider:
    gcpsm:
      projectID: knowledge-49722
      auth:
        workloadIdentity:
          clusterLocation: northamerica-northeast2-a
          clusterName: demarkus
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
