# Shared GCS-backed knowledge server with the broker in process (ADR 0032).
# Worlds share one UDP listener; clients dial the knowledge Service and select
# the world by TLS SNI (<name>-knowledge.demarkus-knowledge.svc.cluster.local),
# a name that never resolves in DNS. The HTTP listener behind the Ingress
# serves login (broker.<domain>), the knowledge MCP gateway (<domain>) and the
# memory MCP gateway (<memoryDomain>), whose tenants this process provisions
# and serves.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demarkus-knowledge-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/latebit-io/demarkus-knowledge-system-deploy.git
        revision: main
        files:
          - path: deployment.yaml
  template:
    metadata:
      name: demarkus-knowledge-server
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: default
      source:
        repoURL: ghcr.io/latebit-io/charts
        chart: demarkus-knowledge-server
        targetRevision: 0.77.0
        helm:
          releaseName: knowledge
          values: |
            fullnameOverride: knowledge

            # Exercise one knowledge-server replica per current cluster node.
            replicaCount: 3

            image:
              # 0.52.0 (demarkus #536): the federation graph is derived in this
              # process into the hub world, with no agent or token; image
              # repository is the chart default, ghcr.io/latebit-io/demarkus-knowledge.
              # 0.52.1 (demarkus #537): the federation leader holds its in-process
              # watches instead of reopening them every 20 ms.
              # 0.54.0 (demarkus #538 to #543, ADR 0036): the commit-log bucket
              # store. No migration: a schema 1 bucket is refused at open, so the
              # world buckets are emptied first (docs/runbook-commit-log-rollout.md).
              # 0.55.2 (demarkus #551, ADR 0038): a write carries the verified
              # email as user and the MCP client name as agent; the commit-log
              # entry gains an optional user field. 0.54.0 pods decode slots
              # strictly, so during the roll an old pod stops following slots a
              # new pod wrote, and there is no rollback to 0.54.0 once a 0.55.2
              # write lands.
              # 0.56.0 (demarkus #556): mark_fetch and mark_explore return every
              # metadata key, no verbose argument. No store format change.
              # 0.61.2 (demarkus #559 to #568, ADR 0035): graph observed on
              # write, budgeted lookup with hops, content-addressed fetch and
              # the mark_resolve and mark_index tools removed, pre-1.0 shims
              # dropped. The body-hash index lived only in the in-memory
              # snapshot; checkpoints and slots are unchanged, so 0.56.0 pods
              # follow the log during the roll and rollback stays open.
              # 0.63.0 (demarkus #570, #572, ADR 0040): the standalone
              # federation agent and its NetworkPolicy ingress rule are gone
              # (the hub derives in process since 0.52.0); mark_publish runs
              # the style gate and answers with a note; mark_doctor,
              # mark_curate and mark_promote join the gateway. No store
              # format change; the policy parser reads the same lines.
              # 0.63.1 (demarkus #574): mark_doctor Markdown caps each check
              # at 20 findings so a whole-world audit fits one MCP result;
              # the journal route dates by the gateway's local day. No store
              # format change.
              # 0.64.0 (demarkus #577, ADR 0041): the gateway serves the hub's
              # four branding documents at /worlds/<hub>/.well-known/library/
              # without a bearer, cached a minute per document, so a cold
              # library pod brands its sign-in page. No store format change.
              # 0.65.0 (demarkus #583): the hub world's write policy is the
              # floor every other world's policy is merged over (floorWorld,
              # rendered from hub: true); every write is scanned for secrets
              # (refused, never overridable) and personal data (contentCheck.pii
              # block by default); allow_tags.<axis> lists a tag axis's values;
              # the style guide is seeded on the hub create-only, so root's
              # hand-published style.md stays and mark_doctor reports it stale
              # until its rule table is pasted in. No store format change.
              # 0.65.1 (demarkus #586): mark_doctor fetches the style guide by
              # path, since LIST hides .well-known/, so the stale-guide check
              # reaches root. No store format change.
              # 0.74.1 (demarkus #604 to #637, ADR 0037 and 0045): a landed
              # write's response carries a `warning` key with what the gate let
              # through (a PII warn, a warn-level policy miss) instead of a log
              # line; a world can live on a directory (dir in place of bucket,
              # unused here); demarkus-knowledge serves the worlds alone when
              # given no broker config; the worlds-only binary is gone. The
              # config keeps today's defaults (policy seeded, health on 8081,
              # certificate pair). No store format change.
              # 0.74.2 (demarkus #640): mark_doctor reads a world's own
              # absolute links (mark://<world>/...) as internal, so flat
              # collections stop reading as orphans; a landed PUBLISH or
              # APPEND answers with etag and content-hash. No config or
              # store format change.
              # 0.75.0 (demarkus #643): plugin host tools in the shared tool
              # class table, nothing the gateway serves. No config or store
              # format change.
              # 0.75.2 (demarkus #646 to #652): memory worlds are `gated`
              # (served only through the bearer listener and in process; the
              # provisioner writes the key into the worlds fragment and the
              # chart renders it from `profile: memory`, so chart and image
              # move together, the loader is strict); each gateway dispatches
              # only its profile's worlds; a dynamically registered client
              # with an https redirect sees a consent page before its code;
              # the floor policy is read without the floor's lock. No store
              # format change.
              # 0.75.3 (demarkus #655): a checkpoint row seeded into the gateway
              # graph carries the world's address as its source, the same the
              # gateway records for its own writes, so a backlink read after a
              # publish no longer shows stale with revision-conflict; a hub
              # bullet added on publish joins the section listing the
              # document's siblings. No config or store format change.
              # 0.75.4 (demarkus #658, issue #542): a content object the
              # bucket rejects fails the publish instead of acknowledging a
              # version over a missing blob; heading-derived titles are capped
              # at the metadata limit; checkpoint shards are measured against
              # a byte budget and the layout widens, kept on later
              # checkpoints. Format relaxation: a widened root (shard bits
              # above the count rule) is refused by an older image, so no
              # rollback past a widened checkpoint. No config change.
              # 0.76.0 (demarkus #664): near-duplicate gate on every PUBLISH
              # and APPEND, warn only, named on the `warning` key; LOOKUP
              # `match: similar` for the promote dry run; the doctor's near
              # tier. Signatures live in the in-memory section index, so the
              # first write after a roll is unchecked until it is built. No
              # config or store format change.
              # 0.77.0 (demarkus #666): the write gate warms each writable
              # world's section index at open, so a pod's first write after a
              # roll is judged instead of passing while the index is cold; a
              # cold index is waited for up to the one-second freshness bound.
              # One index build per writable world per pod start, in the
              # background. No config or store format change.
              tag: "0.77.0"

            # No pre-install Job: writes go through the gateway and the
            # federation deriver in process, so no world needs a token Secret.
            # An operator token goes in <world>-static-tokens.
            tokens:
              bootstrap:
                enabled: false

            service:
              type: ClusterIP

            tls:
              certManager:
                enabled: true
                issuerRef:
                  kind: ClusterIssuer
                  name: selfsigned

            serviceAccount:
              workloadIdentity:
                gsa: demarkus-knowledge-server@{{ .projectId }}.iam.gserviceaccount.com

            networkPolicy:
              allowUnrestrictedHTTPS: true

            # Spot pool is tainted; replicas are stateless, so preemption only
            # reschedules them.
            nodeSelector:
              cloud.google.com/gke-spot: "true"
            tolerations:
              - key: cloud.google.com/gke-spot
                operator: Equal
                value: "true"
                effect: NoSchedule

            # Pilot sizing fits the current saturated e2-medium pool. Increase
            # node capacity before raising these to chart production defaults.
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi

            broker:
              # Issuer and management API (RFC 8414 §3.3).
              publicURL: "https://broker.{{ .domain }}"
              mcp:
                publicURL: "https://{{ .domain }}"
              memory:
                publicURL: "https://{{ .memoryDomain }}"
              # Logins and MCP host registrations (ADR 0034); the bucket and
              # its grant come from tofu module.knowledge_storage.
              stateBucket: "gs://{{ .brokerStateBucket }}"
              oidc:
                issuer: "https://accounts.google.com"
                clientID: "{{ .oauthClientId }}"
                existingSecretRef:
                  name: oidc-client
                # From OpenBao (external-secrets.yaml here), so the key outlives
                # the pods and tokens minted before a restart still verify.
                existingSigningKeyRef:
                  name: jwks-signing-key
                redirectURL: "https://broker.{{ .domain }}/auth/callback"
                # Matched against Google's `hd` claim; empty admits any
                # verified account (see deployment.yaml allowDomains).
                allowDomains:
                {{- range .allowDomains }}
                  - {{ . | quote }}
                {{- end }}
              # Confidential web clients from deployment.yaml webClients[]; each
              # entry sets all four keys so missingkey=error catches a half one.
              webClients:
              {{- range .webClients }}
                - clientID: {{ .clientID | quote }}
                  clientSecretHash: {{ .clientSecretHash | quote }}
                  name: {{ .name | quote }}
                  redirectURIs:
                  {{- range .redirectURIs }}
                    - {{ . | quote }}
                  {{- end }}
              {{- end }}
              # An MCP session handshake and the library's universe floor
              # arrive in bursts; the chart's 10/min suits CLI agents only.
              rateLimit:
                tokens:
                  perMinute: 120
                  burst: 60
                # Readers reach the broker from the VPN's egress address, and
                # the library forwards that as X-Forwarded-For, so the IP
                # bucket on /device/token and /token/revoke is per company.
                # Sized for a login wave of a few hundred people plus hourly
                # refresh churn.
                login:
                  perMinute: 600
                  burst: 200

            # Memory tenants: created on first arrival of an allowlisted
            # identity, recorded in demarkus-memory-broker-registry.
            provisioning:
              mode: allowlisted
              allow:
                emails:
                {{- range .memory.allowEmails }}
                  - {{ . }}
                {{- end }}
              maxTenants: {{ .memory.maxTenants }}
              maxDocumentsPerTenant: {{ .memory.maxDocumentsPerTenant }}
              bucketProject: "{{ .projectId }}"
              bucketLocation: "{{ .region }}"

            worldDefaults:
              # Tenant buckets only: every world below sets its bucket.url.
              bucketPrefix: "gs://{{ .projectId }}-memory-"

            ingress:
              enabled: true
              className: nginx
              host: "broker.{{ .domain }}"
              mcp:
                host: "{{ .domain }}"
              memory:
                host: "{{ .memoryDomain }}"
              tls:
                certManager:
                  enabled: true
                  issuerRef:
                    kind: ClusterIssuer
                    name: letsencrypt-prod

            {{- $hasStorageWorld := false }}
            {{- range .worlds }}{{- if eq (index . "backend") "shared" }}{{- $hasStorageWorld = true }}{{- end }}{{- end }}
            {{- if not $hasStorageWorld }}{{ fail "deployment.yaml: shared knowledge server requires at least one backend: shared world" }}{{- end }}
            # allow is the writer list: adminEmails, the world's writerEmails
            # and writerDomains. Reads pass the org gate alone.
            worlds:
            {{- range .worlds }}
            {{- if eq (index . "backend") "shared" }}
              - name: {{ .name }}
                authorities:
                  - {{ .name }}-knowledge.demarkus-knowledge.svc.cluster.local
                bucket:
                  url: gs://{{ .storage.bucket }}
                  worldID: {{ .storage.worldID }}
                readOnly: {{ default false (index .storage "readOnly") }}
                {{- if index . "hub" }}
                # The federation hub: every world's graph is checkpointed here.
                hub: true
                {{- end }}
                allow:
                  emails:
                  {{- range $.adminEmails }}
                    - {{ . }}
                  {{- end }}
                  {{- /* index, not `default list`: sprig-only, absent from the gomplate smoke. index yields nil on a missing key, so range is a no-op. */}}
                  {{- range (index . "writerEmails") }}
                    - {{ . }}
                  {{- end }}
                  domains:
                  {{- range $.writerDomains }}
                    - {{ . | quote }}
                  {{- end }}
            {{- end }}
            {{- end }}
      destination:
        server: https://kubernetes.default.svc
        namespace: demarkus-knowledge
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # The old brokers' Ingresses hold these hosts until their apps are
        # pruned, and the nginx webhook refuses ours until then.
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
