# Broker secrets from GCP Secret Manager (ESO `gcp-sm`) into demarkus-knowledge, read by the knowledge
# pods through the chart's broker.oidc.existingSecretRef and
# existingSigningKeyRef (OIDC_CLIENT_SECRET, BROKER_SIGNING_KEY env).
#
# Both are the entries the standalone knowledge broker used, so the issuer
# keeps its signing key. refreshInterval 1h; a rotation reaches the pods on
# their next restart.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oidc-client
  namespace: demarkus-knowledge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: oidc-client
    creationPolicy: Owner
  data:
    # Chart default: broker.oidc.existingSecretRef.key=clientSecret.
    - secretKey: clientSecret
      remoteRef:
        key: broker-oidc-client
        property: client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwks-signing-key
  namespace: demarkus-knowledge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: jwks-signing-key
    creationPolicy: Owner
  data:
    # Chart default: broker.oidc.existingSigningKeyRef.key=signing-key.pem.
    - secretKey: signing-key.pem
      remoteRef:
        key: broker-jwks-signing-key
        property: pem
