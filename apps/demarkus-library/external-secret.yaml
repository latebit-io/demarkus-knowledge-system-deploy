# The library's Secrets, materialized by ESO from GCP Secret Manager through
# the `gcp-sm` ClusterSecretStore. Secret containers come from tofu
# (platform-iam secret_manager_secrets); values are added out of band with
# `gcloud secrets versions add` as JSON, read here by property. Pods pick up
# a changed value on their next restart.
#
# library-oauth-client is the plaintext half of the `library-web` webClients
# registration; the broker side (deployment.yaml) holds only its sha256, so a
# rotation pairs with a clientSecretHash update (runbook-broker-web-clients.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: library-oauth-client
  namespace: demarkus-library
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: library-oauth-client
    creationPolicy: Owner
  data:
    # Chart default: library.broker.existingSecretRef.key=clientSecret.
    - secretKey: clientSecret
      remoteRef:
        key: library-oauth-client
        property: client_secret
---
# ExternalSecret for the AI librarian's LLM provider key (Phase 4). The chart
# consumes it via library.librarian.{keyEnv,existingSecretRef}, rendering a
# MINIMAX_API_KEY secretKeyRef env on the pod; nib's llmconfig auto-selects
# the MiniMax builtin profile because exactly that key is set (unset ⇒ the
# librarian stays dark and the reading room is unchanged).
#
# One-time seeding (the ESO policy already grants secret/data/library/*):
#   bao kv put secret/library/llm minimax_api_key=<key>
# Rotation: update the OpenBao entry; ESO refreshes within the hour; the
# library picks it up on next pod restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: library-llm
  namespace: demarkus-library
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: library-llm
    creationPolicy: Owner
  data:
    - secretKey: MINIMAX_API_KEY
      remoteRef:
        key: library-llm
        property: minimax_api_key
---
# Cookie sealing key shared by every library replica (DEMARKUS_SESSION_KEY).
# The value is base64 of 32 random bytes; rotating it signs every reader out.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: library-session-key
  namespace: demarkus-library
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: library-session-key
    creationPolicy: Owner
  data:
    - secretKey: sessionKey
      remoteRef:
        key: library-session-key
        property: session_key
