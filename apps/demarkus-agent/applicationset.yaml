# demarkus-agent: the federation crawler that fortifies the `root` hub.
#
# Config-driven: this ApplicationSet's git-files generator reads the repo-root
# deployment.yaml and derives the agent's crawl frontier from `worlds[]` —
# `seeds` from the content worlds, `hubs` from the `hub: true` world. So adding
# a world is now a SINGLE edit to deployment.yaml (it drives the worlds
# ApplicationSet, the broker's worlds[], AND these seeds) — the old three-place
# coupling is gone.
#
# It crawls each content world directly over mark:// QUIC (LIST + FETCH),
# collects every document's content-hash, and PUBLISHES an aggregated hash
# index into the `root` hub. That index is what makes `root` the connector for
# discovering all the worlds: an agent on `root` can `mark_resolve` any hash.
#
# Topology notes:
#   - The agent dials worlds DIRECTLY (not through the broker), so seeds + hub
#     are cluster-internal Service DNS (`<name>.<name>.svc.cluster.local:6309`),
#     derived from the world NAME — no domain needed.
#   - Worlds use self-signed certs with no shared CA → `insecure: true` (same
#     posture as the broker's worldDialer.insecureSkipVerify).
#   - Reads are open (publish-only invariant), so crawling needs NO token. Only
#     the PUBLISH into `root` needs one — ESO copies root's raw admin token
#     into this namespace (cluster-secret-store.yaml + external-secret.yaml)
#     and the chart projects it to ~/.mark/tokens.d/root:6309.
#   - `perServer: true` → publishes `/index/<host>.md`, never clobbering root's
#     curated /index.md. That subpath needs root's admin token widened to `/**`
#     (set in the worlds ApplicationSet).
#   - The ESO credential is hardcoded to `root` (the fixed-name hub convention),
#     so the `hub: true` world in deployment.yaml MUST be named `root`.
#
# Sync wave: 2 — after the broker + worlds (wave 1), so `root` and its
# `root-token-values` Secret exist before ESO copies the token. The world
# token source is not optional: the agent container waits in
# ContainerCreating until ESO has materialized the Secret, then starts with
# the token in place.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demarkus-agent
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        # Self-reference literal (a generator can't read its own repo URL from
        # the file it reads); same value as deployment.yaml's repoURL. revision
        # matches the root ApplicationSet.
        repoURL: https://github.com/latebit-io/demarkus-knowledge-system-deploy.git
        revision: main
        files:
          - path: deployment.yaml
  template:
    metadata:
      name: demarkus-agent
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "2"
        # Argo v2.13 ServerSideDiff fails while stripping mutation-webhook
        # fields when a volume changes type (secret -> projected, agent chart
        # 0.40.0): "associative list with keys has an element that omits key
        # field name" (argo-cd #20792). Classic diff is no way out: this
        # cluster's k8s has status fields Argo's bundled schema lacks. Keeping
        # webhook mutations in the diff skips the failing step. Drop once
        # Argo is upgraded past the fix.
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
    spec:
      project: default
      source:
        repoURL: ghcr.io/latebit-io/charts
        chart: demarkus-agent
        targetRevision: 0.40.0
        helm:
          releaseName: demarkus-agent
          values: |
            # Image tag defaults to .Chart.appVersion; explicit pin so an
            # unexpected chart bump can't pull a newer crawler than reviewed.
            # 0.12.43 adds --publish-graph (publishGraph below). 0.13.1 filters
            # loopback/localhost link targets out of the published graph and
            # normalizes target ports (#209), so dev-crawl artifacts
            # (127.0.0.1:*, localhost) and port-variant duplicates no longer
            # surface as phantom federated portals on the reading-room floor.
            #
            # 0.19.0 (monorepo #240; versions now track client/ releases,
            # hence the jump from 0.13.x) publishes every generated artifact
            # (/graph.md, hash indexes) with retention=20 by default: the hub
            # world prunes each one to its newest 20 versions on write (needs
            # server 0.20.0 — bumped in this same PR). Clears the hub graph
            # document's 545-version backlog on the first publish after the
            # roll. Override via -publish-retention or publish.retention in
            # config; 0 keeps every version.
            #
            # 0.21.1 (demarkus #251/#254) publishes the enriched six-column
            # /graph.md (edges carry rel/label/anchor/count), which the MCP
            # surfaces now seed from (#253). Includes the #222 Merge fix: a
            # crawl that fails to fetch a node no longer blanks its stored
            # title, so a stalled crawl cannot publish title-less rows into
            # the hub aggregate for seeding to amplify.
            # 0.21.3 (demarkus #259) falls back to the H1 for node titles when
            # publisher metadata declares none, so soul-style docs stop
            # publishing nameless into the hub graph. (0.21.2 was test-only.)
            # 0.24.0 rolls up #261 (join URLs), #267 (agent ships as a release
            # tarball), and #273 (markdown-only content contract in the shared
            # client, so the agent's generated publishes stay contract-clean).
            # 0.24.4 rolls up #277 (shared-client render guard against
            # non-UTF-8 bodies), #282/#284 (tokens minted with recursive /**
            # scope), the #302 code-quality sweep, and #305 dependency bumps
            # (x/crypto, x/net, quic-go). Chart 0.21.3 → 0.24.4 realigns with
            # appVersion; values schema unchanged.
            # 0.24.5 picks up the #309 APPEND metadata-merge fix through
            # the shared client; no agent behavior change. Chart values
            # schema unchanged.
            #
            # 0.24.7 (demarkus #318 and #320, ADR 0005) keys graph nodes by
            # identity: the authority with the default port omitted. The
            # published /graph.md changes shape with it, so the broker must
            # already be on 0.15.2+ to translate the new rows; sync-wave 1
            # rolls it first. Consumers normalize on ingest, so exports
            # written under either rule keep working. Chart values schema
            # unchanged.
            # 0.26.1 adds the policy metadata required for generated graph and
            # index publishes against the production shared server.
            # 0.27.0 separates logical Mark authority from dial address and
            # TLS SNI, keeps publish-only hubs out of discovery, and prevents
            # generated /graph.md links from recursively amplifying topology.
            # 0.31.0 adds complete pageable inventory, atomic sharded hash
            # indexes, and manifest-last graph snapshots while dual-publishing
            # legacy /graph.md for existing consumers.
            # 0.31.6 flips the chart's perServer default to true (already set
            # below) and trims MCP tool descriptions (#409).
            # 0.40.0 rolls up #447 (unified graph edge extraction and relative
            # link resolution), #451 (revision-aware graph freshness, bounded
            # source re-crawl) and #510 (agent reads ~/.mark/tokens.d; chart
            # gains tokens.fromWorldSecrets, used below in place of the ESO
            # tokens.toml template). Values schema otherwise unchanged.
            image:
              tag: "0.40.0"

            {{- if not .worlds }}{{ fail "deployment.yaml: worlds[] must not be empty — the agent has nothing to crawl or publish to" }}{{- end }}
            {{- $hubName := "" }}{{- $multipleHubs := false }}
            {{- range .worlds }}{{- if index . "hub" }}{{- if ne $hubName "" }}{{- $multipleHubs = true }}{{- end }}{{- $hubName = .name }}{{- end }}{{- end }}
            {{- if or $multipleHubs (ne $hubName "root") }}{{ fail "deployment.yaml: exactly one hub is required and it must be named root — the agent token is keyed to root:6309" }}{{- end }}
            config:
              # Graph, index, state, and token identity use stable logical
              # world authorities. Explicit endpoints below carry private
              # cluster dialing + the SNI expected by the shared listener.
              # Every world WITHOUT `hub: true` is a seed. The hub remains a
              # publish-only aggregation point unless also listed here.
              seeds:
              {{- range .worlds }}
              {{- if not (index . "hub") }}
                - mark://{{ .name }}
              {{- end }}
              {{- end }}
              # Publish the aggregated index into the hub world(s). `index . "hub"`
              # safely reads the optional `hub` field (a Go builtin that returns
              # nil — not an error — when a content world omits the key).
              hubs:
              {{- range .worlds }}
              {{- if (index . "hub") }}
                - mark://{{ .name }}
              {{- end }}
              {{- end }}
              endpoints:
              {{- range .worlds }}
                {{ .name }}:
                  dialAddress: "{{ if eq (index . "backend") "shared" }}{{ .name }}-knowledge.demarkus-knowledge.svc.cluster.local{{ else }}{{ .name }}.{{ .name }}.svc.cluster.local{{ end }}:6309"
                  serverName: "{{ if eq (index . "backend") "shared" }}{{ .name }}-knowledge.demarkus-knowledge.svc.cluster.local{{ else }}{{ .name }}.{{ .name }}.svc.cluster.local{{ end }}"
              {{- end }}
              # Completeness enforcement rejects any reached directory at the
              # depth boundary. Current project and journal trees reach depth 4.
              crawl:
                maxDepth: 10
              # Re-crawl every five minutes. Small universe, cheap reads; keeps
              # the hash index fresh (politeness defaults still throttle
              # per-server).
              schedule:
                interval: 5m

            # One machine index per discovered server at /index/<host>.md, so
            # the agent never writes root's curated /index.md. Requires root's
            # publish token to cover `/index/**` (widened in the worlds AppSet).
            perServer: true

            # Also publish the link-graph export to the hub at /graph.md — the
            # durable topology the reading-room floor renders as cross-world
            # edges + portal nodes. Same root publish token (/index/** widened
            # to /** covers /graph.md). The library reads it via DEMARKUS_HUB.
            publishGraph: true

            # Self-signed world certs + no shared CA → skip outbound TLS verify.
            insecure: true

            # Publish credential for the `root` hub. ESO copies root-token-values
            # (key admin) into this namespace as demarkus-agent-hub-tokens — see
            # external-secret.yaml. The chart projects it to
            # ~/.mark/tokens.d/root:6309; the mount is not optional, so the pod
            # waits for the Secret rather than starting unauthenticated.
            tokens:
              fromWorldSecrets:
                - hostPort: "root:6309"
                  secret: demarkus-agent-hub-tokens
      destination:
        server: https://kubernetes.default.svc
        namespace: demarkus-agent
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
