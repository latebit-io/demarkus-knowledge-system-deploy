# Copies root's raw admin token (root-token-values:admin, read via the
# in-cluster-root store) into the agent namespace unchanged. The demarkus-agent
# chart projects that key to ~/.mark/tokens.d/root:6309 through
# `tokens.fromWorldSecrets` in applicationset.yaml; no tokens.toml render here.
#
# refreshInterval: 1h — rotating root's token (e.g. a world re-bootstrap)
# propagates to the agent within the hour. The agent reads tokens at startup,
# so the rollout after a rotation is a pod restart, not a crawl tick. ESO also
# materializes immediately on first creation, so once `root-token-values`
# exists the agent's token Secret appears without waiting a full interval.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demarkus-agent-hub-tokens
  namespace: demarkus-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: in-cluster-root
    kind: ClusterSecretStore
  target:
    name: demarkus-agent-hub-tokens
    creationPolicy: Owner
  data:
    # kubernetes provider: remoteRef.key = Secret name in remoteNamespace,
    # property = the data key within it (root-token-values has key `admin`).
    - secretKey: admin
      remoteRef:
        key: root-token-values
        property: admin
