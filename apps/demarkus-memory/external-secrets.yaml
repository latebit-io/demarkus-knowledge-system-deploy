# ExternalSecret resources bridging the memory broker's secrets from
# OpenBao into the demarkus-memory namespace.
#
#   - oidc-client: the SAME OpenBao entry the knowledge broker uses
#     (broker/oidc-client) — one shared Google OAuth client; only the
#     redirect-URI list in the Google console grows.
#   - memory-jwks-signing-key: the memory broker's OWN signing key so the
#     two issuers rotate independently. Stored under broker/* because the
#     external-secrets OpenBao policy reads only secret/data/broker/*.
#     Seed it once (port-forward + auth per docs/runbook-openbao-seed.md):
#       openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out key.pem
#       bao kv put secret/broker/memory-jwks-signing-key pem=@key.pem
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oidc-client
  namespace: demarkus-memory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: oidc-client
    creationPolicy: Owner
  data:
    - secretKey: clientSecret
      remoteRef:
        key: broker/oidc-client
        property: client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memory-jwks-signing-key
  namespace: demarkus-memory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: memory-jwks-signing-key
    creationPolicy: Owner
  data:
    - secretKey: signing-key.pem
      remoteRef:
        key: broker/memory-jwks-signing-key
        property: pem
